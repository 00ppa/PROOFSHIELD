[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofshield"
version = "0.1.0"
description = "PROOFSHIELD: Cybersecurity Detection Assurance and Failure-Diagnosis Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PROOFSHIELD Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
