[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofshield"
version = "0.1.0"
description = "PROOFSHIELD: Cybersecurity Detection Assurance and Failure-Diagnosis Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FS", email = "159800057+00ppa@users.noreply.github.com" },
]
maintainers = [
    { name = "FS", email = "159800057+00ppa@users.noreply.github.com" },
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/00ppa/PROOFSHIELD"
Repository = "https://github.com/00ppa/PROOFSHIELD"
Issues = "https://github.com/00ppa/PROOFSHIELD/issues"

[project.optional-dependencies]
research = [
    "scikit-learn>=1.5,<1.6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofshield = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
